[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elite-dangerous-mcp"
version = "0.1.0"
description = "Client for querying Elite Dangerous system data from EDSM"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2.0",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["server"]
packages = ["src", "src.edsm"]
